<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ムスビ</title>
  <style>
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --ink:#242320;
  --ink-soft:#615d52;
  --ink-faint:#948d7d;
  --line:#e3ddd0;
  --idea:#a9691f;
  --idea-soft:#f7ecdd;
  --tech:#1f6f5c;
  --tech-soft:#e6f2ee;
  --cta:#2c4a63;
  --cta-soft:#e8eef2;
  --chip:#efece3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a17; --surface:#242320; --ink:#eeece5; --ink-soft:#a9a396; --ink-faint:#726c5f;
    --line:#3a382f; --idea:#d99a4f; --idea-soft:#332a1c; --tech:#5cbaa2; --tech-soft:#1b2f29;
    --cta:#7fa8c9; --cta-soft:#28333c; --chip:#2c2a24;
  }
}
*{box-sizing:border-box;}
body{
  margin:0; padding:0;
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans JP","IBM Plex Sans",-apple-system,sans-serif;
}

.app-container {
  max-width: 500px;
  margin: 0 auto;
  height: 100dvh;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 20px rgba(0,0,0,0.05);
}

.panel{display:none;flex:1;flex-direction:column;overflow:hidden;position:relative;}
.panel.active{display:flex;}

/* ---- shared bits ---- */
.appbar{
  padding:16px 18px 10px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;flex-shrink:0;
}
.appbar-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.appname{font-weight:600; font-size:18px;}

.post-btn-top {
  background: var(--cta);
  color: var(--surface);
  border: none;
  border-radius: 100px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(44, 74, 99, 0.2);
}
.post-btn-top:hover { opacity: 0.9; }

.tabs{display:flex;gap:6px;}
.tab{
  flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;border:1px solid transparent;color:var(--ink-soft);
}
.tab[data-lane="idea"].tab-active{background:var(--idea-soft);color:var(--idea);}
.tab[data-lane="tech"].tab-active{background:var(--tech-soft);color:var(--tech);}

.scroll{flex:1;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;}

.card{
  display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;
  font:inherit;color:inherit;width:100%;
}
.card:hover{border-color:var(--ink-faint);}
.avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;color:#fff;
}
.lane-idea .avatar{background:var(--idea);}
.lane-tech .avatar{background:var(--tech);}
.card-body{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%;}
.card-title{font-size:14px;font-weight:600;}
.card-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}

.bottomnav{
  display:flex;border-top:1px solid var(--line);flex-shrink:0;background:var(--surface);
  padding-bottom: env(safe-area-inset-bottom);
}
.navbtn{
  flex:1;text-align:center;padding:10px 0 8px;font-size:10.5px;color:var(--ink-faint);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.navbtn .dot{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;}
.navbtn.active{color:var(--ink);font-weight:600;}
.navbtn.active .dot{background:var(--cta-soft);color:var(--cta);}

/* ---- detail screen ---- */
.detail-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-shrink:0;}
.backbtn{font-size:13px;color:var(--ink-soft);cursor:pointer;background:none;border:none;padding:4px;}
.detail-scroll{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;}
.lane-badge{
  align-self:flex-start;font-size:11px;padding:4px 10px;border-radius:100px;
}
.lane-badge.idea{background:var(--idea-soft);color:var(--idea);}
.lane-badge.tech{background:var(--tech-soft);color:var(--tech);}
.detail-block dt{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:4px;}
.detail-block dd{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap;}
.detail-block{margin-bottom:14px;}
.cta-btn{
  background:var(--cta);color:var(--surface);border:none;border-radius:12px;
  padding:13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;flex-shrink:0;
  width: 100%;
}
.cta-btn:hover{opacity:.92;}
.delete-btn{
  background: var(--chip); color: var(--ink-soft); border: none; border-radius: 12px;
  padding: 13px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; flex-shrink: 0;
  margin-top: 8px; width: 100%;
}
.delete-btn:hover{opacity:.8;}

/* ---- chat ---- */
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-shrink:0;}
.chat-scroll{flex:1;overflow-y:auto;padding:14px 14px;display:flex;flex-direction:column;gap:8px;}
.bubble{max-width:78%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.5; word-wrap:break-word;}
.bubble.them{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px;}
.bubble.me{align-self:flex-end;background:var(--cta-soft);color:var(--ink);border-bottom-right-radius:4px;}
.chat-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-shrink:0; padding-bottom: calc(10px + env(safe-area-inset-bottom));}
.chat-input input{
  flex:1;border:1px solid var(--line);border-radius:100px;padding:9px 14px;font:inherit;font-size:13px;
  background:var(--surface);color:var(--ink);
}
.chat-input button{
  background:var(--cta);color:var(--surface);border:none;border-radius:100px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;
}

/* ---- profile (post / mypage) ---- */
.profile-scroll{flex:1;overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);margin-bottom:5px;}
.field textarea, .field input{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;
  background:var(--surface);color:var(--ink);resize:none;
}
.save-btn{background:var(--cta);color:var(--surface);border:none;border-radius:12px;padding:12px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:4px;width:100%;}

  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">

  <!-- ① HOME -->
  <div class="panel active" data-panel="home">
    <div class="appbar">
      <div class="appbar-top">
        <div class="appname">ムスビ</div>
        <button class="post-btn-top" id="headerPostBtn">＋ 新規投稿</button>
      </div>
      <div class="tabs">
        <div class="tab tab-active" data-lane="idea" id="tabIdea">アイデア</div>
        <div class="tab" data-lane="tech" id="tabTech">技術</div>
      </div>
    </div>
    <div class="scroll" id="cardList"></div>
    
    <div class="bottomnav">
      <div class="navbtn active" data-nav="home"><span class="dot">◎</span>ホーム</div>
      <div class="navbtn" data-nav="messages"><span class="dot">✉</span>メッセージ</div>
      <div class="navbtn" data-nav="mypage"><span class="dot">👤</span>プロフィール</div>
    </div>
  </div>

  <!-- ② DETAIL -->
  <div class="panel" data-panel="detail">
    <div class="detail-head">
      <button class="backbtn" data-back="home">← 戻る</button>
    </div>
    <div class="detail-scroll" id="detailBody"></div>
  </div>

  <!-- ③ MESSAGES LIST -->
  <div class="panel" data-panel="messages">
    <div class="appbar">
      <div class="appname">メッセージ一覧</div>
    </div>
    <div class="scroll" id="messageList"></div>
    
    <div class="bottomnav">
      <div class="navbtn" data-nav="home"><span class="dot">◎</span>ホーム</div>
      <div class="navbtn active" data-nav="messages"><span class="dot">✉</span>メッセージ</div>
      <div class="navbtn" data-nav="mypage"><span class="dot">👤</span>プロフィール</div>
    </div>
  </div>

  <!-- ④ CHAT -->
  <div class="panel" data-panel="chat">
    <div class="chat-head">
      <button class="backbtn" data-back="messages">← 戻る</button>
      <div>
        <div style="font-size:14px;font-weight:600;" id="chatName">ユーザーさん</div>
      </div>
    </div>
    <div class="chat-scroll" id="chatScroll"></div>
    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="メッセージを入力">
      <button id="chatSend">送信</button>
    </div>
  </div>

  <!-- ⑤ POST (新規投稿画面) -->
  <div class="panel" data-panel="post">
    <div class="appbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="backbtn" data-back="home" style="font-size:16px;">←</button>
        <div class="appname">新規投稿</div>
      </div>
      <div class="tabs">
        <div class="tab tab-active" data-plane="idea" id="planeIdea">アイデア枠</div>
        <div class="tab" data-plane="tech" id="planeTech">技術枠</div>
      </div>
    </div>
    <div class="profile-scroll" id="postFormArea">
      <!-- ここにアイデア入力フォームが表示されます -->
    </div>
  </div>

  <!-- ⑥ MYPAGE (プロフィール設定画面) -->
  <div class="panel" data-panel="mypage">
    <div class="appbar">
      <div class="appname">プロフィール設定</div>
    </div>
    <div class="profile-scroll">
      <div style="text-align:center; margin-bottom:12px;">
        <div class="avatar" style="width:72px; height:72px; font-size:28px; margin:0 auto 10px; background:var(--chip); color:var(--ink-soft);" id="myAvatarDisplay">👤</div>
        <div style="font-size:12.5px; color:var(--ink-soft); line-height:1.5;">ここで設定したお名前や実績が、<br>あなたの投稿に自動で紐づけられます。</div>
      </div>
      <!-- マイページは「自分の基本情報」だけにスッキリさせました -->
      <div class="field"><label>お名前</label><input id="my-name" placeholder="例: 佐藤さん"></div>
      <div class="field"><label>実績・経歴など</label><textarea id="my-achievement" rows="2" placeholder="例: ハッカソン出場経験あり / 未経験・アイデアのみ"></textarea></div>
      <button class="save-btn" id="saveMyProfileBtn">プロフィールを保存</button>
    </div>
    
    <div class="bottomnav">
      <div class="navbtn" data-nav="home"><span class="dot">◎</span>ホーム</div>
      <div class="navbtn" data-nav="messages"><span class="dot">✉</span>メッセージ</div>
      <div class="navbtn active" data-nav="mypage"><span class="dot">👤</span>プロフィール</div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBgjBb7jgLQLHfcgDSl2UwT549Kfz7F8Nk",
    authDomain: "wordgame-dev-4d3a0.firebaseapp.com",
    databaseURL: "https://wordgame-dev-4d3a0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "wordgame-dev-4d3a0",
    storageBucket: "wordgame-dev-4d3a0.firebasestorage.app",
    messagingSenderId: "349718679870",
    appId: "1:349718679870:web:a01d65cc5bf832fb531c6f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let myUserId = localStorage.getItem('musubi_user_id');
  if(!myUserId) {
    myUserId = 'user_' + Date.now();
    localStorage.setItem('musubi_user_id', myUserId);
  }

  let IDEAS = [];
  let TECHS = [];
  let CHATS = {}; 
  let myProfile = {}; 
  
  let currentLane = 'idea';
  let currentPlane = 'idea';
  let currentChatRoomId = null; 
  let unsubscribeChat = null; 

  // --- 自分のプロフィール読み込み ---
  onValue(ref(db, `musubi/users/${myUserId}`), (snapshot) => {
    if (snapshot.exists()) {
      myProfile = snapshot.val();
      
      document.getElementById('my-name').value = myProfile.name || '';
      document.getElementById('my-achievement').value = myProfile.achievement || '';
      
      const avatarDiv = document.getElementById('myAvatarDisplay');
      avatarDiv.textContent = myProfile.name ? myProfile.name.charAt(0).toUpperCase() : '👤';
      avatarDiv.style.background = 'var(--cta)';
      avatarDiv.style.color = '#fff';
      
      if (document.querySelector('.panel[data-panel="post"]').classList.contains('active')) {
        renderPostForm();
      }
    }
  });

  // --- マイページ：プロフィールの保存 ---
  document.getElementById('saveMyProfileBtn').addEventListener('click', async () => {
    const name = document.getElementById('my-name').value.trim();
    const achievement = document.getElementById('my-achievement').value.trim();

    if(!name) { 
      alert("お名前は入力必須です。"); 
      return; 
    }

    try {
      await set(ref(db, `musubi/users/${myUserId}`), {
        name, achievement,
        updatedAt: Date.now()
      });
      alert('プロフィールを保存しました！');
    } catch (error) {
      console.error("保存失敗", error);
      alert('エラーが発生しました。');
    }
  });

  onValue(ref(db, 'musubi/ideas'), (snapshot) => {
    IDEAS = [];
    snapshot.forEach((childSnapshot) => {
      IDEAS.push({ id: childSnapshot.key, lane: 'idea', ...childSnapshot.val() });
    });
    if (currentLane === 'idea') renderCards();
    if (document.querySelector('.panel[data-panel="messages"]').classList.contains('active')) renderMessageList();
  });

  onValue(ref(db, 'musubi/techs'), (snapshot) => {
    TECHS = [];
    snapshot.forEach((childSnapshot) => {
      TECHS.push({ id: childSnapshot.key, lane: 'tech', ...childSnapshot.val() });
    });
    if (currentLane === 'tech') renderCards();
    if (document.querySelector('.panel[data-panel="messages"]').classList.contains('active')) renderMessageList();
  });

  onValue(ref(db, 'musubi/chats'), (snapshot) => {
    CHATS = snapshot.val() || {};
    if (document.querySelector('.panel[data-panel="messages"]').classList.contains('active')) {
      renderMessageList();
    }
  });

  function showScreen(name){
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
    document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
    if(name === 'messages') renderMessageList();
    if(name === 'post') renderPostForm(); 
  }

  function renderCards(){
    const list = currentLane === 'idea' ? IDEAS : TECHS;
    if (list.length === 0) {
      document.getElementById('cardList').innerHTML = `<div style="text-align:center;color:var(--ink-faint);margin-top:20px;font-size:13px;">まだ投稿がありません。</div>`;
      return;
    }
    document.getElementById('cardList').innerHTML = list.map(item => `
      <button class="card lane-${item.lane}" data-id="${item.id}">
        <div class="avatar">${item.initial || '?'}</div>
        <div class="card-body">
          <div class="card-title">${item.title}</div>
          <div class="card-desc">${item.summary}</div>
          <div class="card-meta">${item.name} ・ ${item.achievement || '実績なし'}</div>
        </div>
      </button>`).join('');
    document.querySelectorAll('#cardList .card').forEach(c => c.addEventListener('click', () => openDetail(c.dataset.id)));
  }

  function openDetail(id){
    const item = [...IDEAS, ...TECHS].find(x => x.id === id);
    if(!item) return;
    const laneLabel = item.lane === 'idea' ? 'アイデア枠' : '技術枠';
    const isMine = (item.authorId === myUserId);
    
    let actionButtons = '';
    if (isMine) {
      actionButtons = `
        <div style="margin-top:auto; padding:14px; background:var(--chip); color:var(--ink-soft); border-radius:12px; text-align:center; font-size:13px; font-weight:600;">
          これはあなたの投稿です。<br>届いたメッセージは「一覧」から確認できます。
        </div>
        <button class="delete-btn" id="deletePostBtn">この投稿を削除する</button>
      `;
    } else {
      actionButtons = `
        <div style="margin-top:auto;">
          <button class="cta-btn" id="toChatBtn">この人にメッセージを送る</button>
        </div>
      `;
    }

    document.getElementById('detailBody').innerHTML = `
      <span class="lane-badge ${item.lane}">${laneLabel}</span>
      <div style="display:flex;gap:12px;align-items:center;">
        <div class="avatar" style="width:48px;height:48px;font-size:16px;">${item.initial || '?'}</div>
        <div>
          <div style="font-size:17px;font-weight:600;">${item.title}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);">${item.name}</div>
        </div>
      </div>
      <dl class="detail-block">
        <dt>${item.lane === 'idea' ? 'ざっくりしたアイデア' : '得意領域'}</dt>
        <dd>${item.summary}</dd>
      </dl>
      <dl class="detail-block">
        <dt>${item.lane === 'idea' ? '作りたいもの' : '使用できる技術領域'}</dt>
        <dd>${item.detail}</dd>
      </dl>
      <dl class="detail-block">
        <dt>アプリ内実績</dt>
        <dd>${item.achievement || '実績なし'}</dd>
      </dl>
      ${actionButtons}
    `;
      
    if (isMine) {
      document.getElementById('deletePostBtn').addEventListener('click', async () => {
        const isConfirmed = confirm('本当にこの投稿を削除しますか？\n（一度削除すると元に戻せません）');
        if(isConfirmed) {
          try {
            const dbPath = item.lane === 'idea' ? `musubi/ideas/${item.id}` : `musubi/techs/${item.id}`;
            await remove(ref(db, dbPath)); 
            alert('投稿を削除しました。');
            showScreen('home');
          } catch (error) {
            console.error("削除失敗", error);
            alert('削除に失敗しました。');
          }
        }
      });
    } else {
      document.getElementById('toChatBtn').addEventListener('click', () => openChat(item, myUserId, item.name + 'さん'));
    }

    showScreen('detail');
  }

  function renderMessageList(){
    const listDiv = document.getElementById('messageList');
    const allItems = [...IDEAS, ...TECHS];
    listDiv.innerHTML = ''; 
    let hasChats = false;

    for (const roomId in CHATS) {
      const roomData = CHATS[roomId];
      const parts = roomId.split('_');
      if (parts.length < 2) continue; 
      const postId = parts[0];
      const visitorId = parts.slice(1).join('_'); 
      
      const targetItem = allItems.find(x => x.id === postId);
      
      if(targetItem) {
        let isMyPost = (targetItem.authorId === myUserId);
        let isMyInquiry = (visitorId === myUserId);

        if (isMyPost || isMyInquiry) {
          hasChats = true;
          const messages = Object.values(roomData);
          const lastMsg = messages[messages.length - 1]; 

          let displayTitle = '';
          let chatPartnerName = '';
          let avatarText = '';
          
          if (isMyPost) {
            displayTitle = `📥 あなたの投稿「${targetItem.title}」へ`;
            chatPartnerName = `応募者（...${visitorId.slice(-4)}）さん`; 
            avatarText = '✉️';
          } else {
            displayTitle = `送信済：${targetItem.name}さん`;
            chatPartnerName = `${targetItem.name}さん`;
            avatarText = targetItem.initial || '?';
          }

          const isUnread = lastMsg.senderId !== myUserId; 

          const btn = document.createElement('button');
          btn.className = 'card';
          btn.style.alignItems = 'center';
          btn.innerHTML = `
            <div class="avatar lane-${targetItem.lane}" style="width:40px;height:40px;font-size:14px; background:${isMyPost ? 'var(--idea)' : ''};">${avatarText}</div>
            <div class="card-body" style="width:100%; overflow:hidden;">
              <div class="card-title" style="font-size:13px;">${displayTitle}</div>
              <div class="card-desc" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:${isUnread ? '600':'400'}; color:${isUnread ? 'var(--ink)':'var(--ink-soft)'};">
                ${lastMsg ? lastMsg.text : 'メッセージがあります'}
              </div>
            </div>
          `;
          
          btn.addEventListener('click', () => openChat(targetItem, visitorId, chatPartnerName));
          listDiv.appendChild(btn);
        }
      }
    }

    if(!hasChats) {
      listDiv.innerHTML = '<div style="text-align:center;color:var(--ink-faint);margin-top:20px;font-size:13px;">まだメッセージのやり取りはありません。</div>';
    }
  }

  function openChat(item, visitorId, partnerName){
    if(!item) return;
    
    currentChatRoomId = item.id + '_' + visitorId;
    document.getElementById('chatName').textContent = partnerName;
    
    if(unsubscribeChat) unsubscribeChat();
    
    const chatRef = ref(db, `musubi/chats/${currentChatRoomId}`);
    unsubscribeChat = onValue(chatRef, (snapshot) => {
      const scroll = document.getElementById('chatScroll');
      scroll.innerHTML = ''; 
      
      snapshot.forEach((child) => {
        const data = child.val();
        const div = document.createElement('div');
        if (data.senderId === myUserId) {
          div.className = 'bubble me';
        } else {
          div.className = 'bubble them';
        }
        div.textContent = data.text;
        scroll.appendChild(div);
      });
      scroll.scrollTop = 999999;
    });

    showScreen('chat');
  }

  document.getElementById('chatSend').addEventListener('click', sendChat);
  document.getElementById('chatInput').addEventListener('keydown', e => { if(e.key === 'Enter') sendChat(); });
  
  function sendChat(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text || !currentChatRoomId) return;
    
    push(ref(db, `musubi/chats/${currentChatRoomId}`), {
      text: text,
      senderId: myUserId,
      timestamp: Date.now()
    });
    
    input.value = ''; 
  }

  // --- 変更点: アイデア部分だけを入力する新規投稿フォーム ---
  function renderPostForm(){
    const container = document.getElementById('postFormArea');

    if(!myProfile.name) {
      container.innerHTML = `
        <div style="text-align:center; padding-top:40px; color:var(--ink-soft); font-size:13.5px; line-height:1.6;">
          お名前が設定されていません。<br>
          まずは右下の「👤プロフィール」から<br>あなたの情報を登録してください。
        </div>
      `;
      return;
    }

    const isIdea = currentPlane === 'idea';

    // 誰として投稿しているかがわかるバッジと、アイデア入力欄を表示
    container.innerHTML = `
      <div style="margin-bottom:16px; font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; background:var(--chip); padding:10px 14px; border-radius:8px;">
        <div class="avatar" style="width:24px;height:24px;font-size:10px;background:var(--cta);color:#fff;">${myProfile.name.charAt(0).toUpperCase()}</div>
        <div><b>${myProfile.name}</b> さんとして投稿します</div>
      </div>
      
      <div class="field">
        <label>${isIdea ? 'プロジェクト名 / タイトル' : 'できる役割 / タイトル'}</label>
        <input id="post-title" placeholder="${isIdea ? '例: サステナブル文具プロジェクト' : '例: フロントエンド開発'}">
      </div>
      <div class="field">
        <label>${isIdea ? 'ざっくりしたアイデア' : '得意領域'}</label>
        <textarea id="post-summary" rows="2" placeholder="${isIdea ? '例: 使い切ったら植物になる、サステナブルな鉛筆' : '例: React / Next.js でのアプリ開発が得意'}"></textarea>
      </div>
      <div class="field">
        <label>${isIdea ? '作りたいもの（詳しく）' : '使用できる技術領域'}</label>
        <textarea id="post-detail" rows="3" placeholder="${isIdea ? 'まずは小ロットで試作し、学内販売から始めたい。' : '例: React, TypeScript, Figma'}"></textarea>
      </div>

      <button class="save-btn" id="submitPostBtn">投稿する</button>
    `;
    
    document.getElementById('submitPostBtn').addEventListener('click', async () => {
      const title = document.getElementById('post-title').value.trim();
      const summary = document.getElementById('post-summary').value.trim();
      const detail = document.getElementById('post-detail').value.trim();
      
      if(!title || !summary) {
        alert("タイトルと概要は入力必須です。");
        return;
      }

      // プロフィールの情報と、今入力したアイデアの情報を合体させる
      const data = {
        name: myProfile.name,
        initial: myProfile.name.charAt(0).toUpperCase(),
        title: title,
        summary: summary,
        detail: detail,
        achievement: myProfile.achievement || '',
        authorId: myUserId, 
        timestamp: Date.now()
      };

      try {
        if(isIdea) {
          await push(ref(db, 'musubi/ideas'), data);
        } else {
          await push(ref(db, 'musubi/techs'), data);
        }
        alert('投稿が完了しました！');
        showScreen('home');
      } catch (error) {
        console.error("保存失敗", error);
        alert('エラーが発生しました。');
      }
    });
  }

  document.getElementById('headerPostBtn').addEventListener('click', () => showScreen('post'));

  document.getElementById('tabIdea').addEventListener('click', () => { currentLane='idea'; document.getElementById('tabIdea').classList.add('tab-active'); document.getElementById('tabTech').classList.remove('tab-active'); renderCards(); });
  document.getElementById('tabTech').addEventListener('click', () => { currentLane='tech'; document.getElementById('tabTech').classList.add('tab-active'); document.getElementById('tabIdea').classList.remove('tab-active'); renderCards(); });
  
  document.getElementById('planeIdea').addEventListener('click', () => { currentPlane='idea'; document.getElementById('planeIdea').classList.add('tab-active'); document.getElementById('planeTech').classList.remove('tab-active'); renderPostForm(); });
  document.getElementById('planeTech').addEventListener('click', () => { currentPlane='tech'; document.getElementById('planeTech').classList.add('tab-active'); document.getElementById('planeIdea').classList.remove('tab-active'); renderPostForm(); });

  document.querySelectorAll('.navbtn').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.nav === 'chat') {
      showScreen('messages');
    } else {
      showScreen(b.dataset.nav);
    }
  }));
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => showScreen(b.dataset.back)));

  renderCards();
  renderPostForm(); 
</script>
</body>
</html>
